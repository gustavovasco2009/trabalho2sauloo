<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Jogos</title>
    <script src="script.js"></script>
</head>
<body>

    <h1>LISTA DE JOGOS</h1>
    <h2>Criar Jogo</h2>
    <label for="NomeJogo">Nome do Jogo:</label>
    <input type="text" id="nomeJogo">
    <br>
    <label for="Genero">Genero do Jogo:</label>
    <input type="text" id="generoJogo">
    <br>
    <label for="Nota">Nota do Jogo:</label>
    <input type="number" id="notaJogo">
    <button type="button" onclick="adicionarJogo()">Adicionar Jogo</button>
    <button type="button" onclick="removerJogo()">Remover Último Jogo</button>
    <h2>Jogos Cadastrados</h2>
</body>
</html>
