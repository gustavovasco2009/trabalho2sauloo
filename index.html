<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Jogos</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <h1>LISTA DE JOGOS</h1>
    
    <label for="nomeJogo">Nome do Jogo:</label>
    <input type="text" id="nomeJogo">

    <br>

    <label for="generoJogo">Gênero do Jogo:</label>
    <input type="text" id="generoJogo">

    <br>

    <label for="notaJogo">Nota do Jogo:</label>
    <input type="number" id="notaJogo">

    <button type="button" onclick="adicionarJogo()">
        Adicionar Jogo
    </button>

    <button type="button" onclick="removerJogo()">
        Remover Último Jogo
    </button>

    <h2>Jogos Cadastrados</h2>

    <div id="listaJogos"></div>

</body>

</html>
